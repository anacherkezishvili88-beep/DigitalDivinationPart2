<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Fortune Cookie</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🥠 Digital Fortune Teller 🥠</h1>
        
        <div class="fortune-section">
            <!-- Cookie Container -->
            <div class="cookie-wrapper" id="cookieWrapper">
                <div class="cookie" id="cookie">
                    <div class="cookie-half cookie-top"></div>
                    <div class="cookie-half cookie-bottom"></div>
                    <div class="cookie-shine"></div>
                </div>
                <p class="instruction" id="instruction">Click the cookie to reveal your fortune!</p>
            </div>

            <!-- Fortune Display -->
            <div class="fortune-display" id="fortuneDisplay">
                <div class="fortune-content">
                    <img id="fortuneImage" src="" alt="Fortune" class="fortune-image">
                </div>
                <button class="button-new-fortune" id="newFortuneBtn">Get Another Fortune</button>
            </div>
        </div>

        <div class="footer">
            <p>✨ May your fortunes guide you ✨</p>
        </div>
    </div>

    <script>
        // INLINE SCRIPT - This should always work
        let fortunes = [];
        let currentState = 'idle';

        console.log('=== SCRIPT STARTED ===');

        // Load fortunes
        function loadFortunes() {
            fortunes = [
                { title: 'Focus on Improving', imageUrl: 'images/json1.jpg' },
                { title: 'Care Instead of Control', imageUrl: 'images/json2.jpg' },
                { title: 'It Didn\'t Work Out', imageUrl: 'images/json3.jpg' },
                { title: 'Enjoy Your Body', imageUrl: 'images/json4.jpg' },
                { title: 'Fortune 5', imageUrl: 'images/json5.jpg' },
                { title: 'Fortune 6', imageUrl: 'images/json6.jpg' },
                { title: 'Fortune 7', imageUrl: 'images/json7.jpg' },
                { title: 'Fortune 8', imageUrl: 'images/json8.jpg' },
                { title: 'Fortune 9', imageUrl: 'images/json9.jpg' },
                { title: 'Fortune 10', imageUrl: 'images/json10.jpg' },
                { title: 'Fortune 11', imageUrl: 'images/json11.jpg' },
                { title: 'Fortune 12', imageUrl: 'images/json12.jpg' },
                { title: 'Fortune 13', imageUrl: 'images/json13.jpg' },
                { title: 'Fortune 14', imageUrl: 'images/json14.jpg' },
                { title: 'Fortune 15', imageUrl: 'images/json15.jpg' },
                { title: 'Fortune 16', imageUrl: 'images/json16.jpg' },
                { title: 'Fortune 17', imageUrl: 'images/json17.jpg' },
                { title: 'Fortune 18', imageUrl: 'images/json18.jpg' },
                { title: 'Fortune 19', imageUrl: 'images/json19.jpg' },
                { title: 'Fortune 20', imageUrl: 'images/json20.jpg' },
                { title: 'Fortune 21', imageUrl: 'images/json21.jpg' },
                { title: 'Fortune 22', imageUrl: 'images/json22.jpg' },
                { title: 'Fortune 23', imageUrl: 'images/json23.jpg' },
                { title: 'Fortune 24', imageUrl: 'images/json24.jpg' },
                { title: 'Fortune 25', imageUrl: 'images/json25.jpg' },
                { title: 'Fortune 26', imageUrl: 'images/json26.jpg' },
                { title: 'Fortune 27', imageUrl: 'images/json27.jpg' },
                { title: 'Fortune 28', imageUrl: 'images/json28.jpg' },
                { title: 'Fortune 29', imageUrl: 'images/json29.jpg' },
                { title: 'Fortune 30', imageUrl: 'images/json30.jpg' }
            ];
            console.log('Fortunes loaded:', fortunes.length);
        }

        function getRandomFortune() {
            return fortunes[Math.floor(Math.random() * fortunes.length)];
        }

        function displayFortune() {
            const fortune = getRandomFortune();
            const img = document.getElementById('fortuneImage');
            const display = document.getElementById('fortuneDisplay');
            
            img.src = fortune.imageUrl;
            img.alt = fortune.title;
            display.classList.add('show');
            
            console.log('Fortune displayed:', fortune.title);
        }

        function crackCookie() {
            console.log('Crack called, current state:', currentState);
            
            if (currentState !== 'idle') return;
            
            currentState = 'cracking';
            
            const top = document.querySelector('.cookie-top');
            const bottom = document.querySelector('.cookie-bottom');
            const wrapper = document.getElementById('cookieWrapper');
            
            top.classList.add('crack');
            bottom.classList.add('crack');
            
            console.log('Animation started');
            
            setTimeout(() => {
                wrapper.classList.add('hide');
                displayFortune();
                currentState = 'displaying';
                console.log('State: displaying');
            }, 800);
        }

        function resetCookie() {
            const top = document.querySelector('.cookie-top');
            const bottom = document.querySelector('.cookie-bottom');
            const wrapper = document.getElementById('cookieWrapper');
            const display = document.getElementById('fortuneDisplay');
            
            top.classList.remove('crack');
            bottom.classList.remove('crack');
            wrapper.classList.remove('hide');
            display.classList.remove('show');
            
            currentState = 'idle';
            console.log('Cookie reset');
        }

        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== DOM LOADED ===');
            
            loadFortunes();
            
            const cookie = document.getElementById('cookie');
            const btn = document.getElementById('newFortuneBtn');
            
            console.log('Cookie element:', cookie ? 'FOUND' : 'NOT FOUND');
            console.log('Button element:', btn ? 'FOUND' : 'NOT FOUND');
            
            if (cookie) {
                cookie.addEventListener('click', crackCookie);
                console.log('Click listener added to cookie');
            }
            
            if (btn) {
                btn.addEventListener('click', resetCookie);
                console.log('Click listener added to button');
            }
            
            console.log('=== READY ===');
        });
    </script>
</body>
</html>
